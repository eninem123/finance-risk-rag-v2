name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install torch CPU version first to save space and memory
        pip install torch --index-url https://download.pytorch.org/whl/cpu --no-cache-dir
        pip install -r requirements.txt --no-cache-dir

    - name: Check system memory
      run: free -h

    - name: Basic compile check
      run: |
        python -m py_compile main.py dashboard.py
        python -m compileall -q src/
